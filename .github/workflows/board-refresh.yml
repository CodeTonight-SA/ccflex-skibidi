name: board-refresh

# "Repo is alive" self-update. Runs ONLY on trusted pushes to main (never on
# pull_request - a forked PR must never get a write token). Regenerates the
# leaderboard from verified entries and commits it back if it changed.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialise: two pushes to main must not race the commit-back.
concurrency:
  group: board-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate leaderboard
        run: node src/leaderboard.mjs

      - name: Commit board if it changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "board already up to date - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(board): refresh leaderboard [skip ci]"
          git push
